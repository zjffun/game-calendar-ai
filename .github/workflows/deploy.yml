name: Deploy to GitHub Pages

on:
  # 推送到 main 自动部署
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 部署到 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 用 pnpm 安装：规避 GitHub 托管 runner 上 npm "Exit handler never called!"
      # 的安装挂起崩溃。pnpm 版本取自 package.json 的 packageManager 字段。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        # 云同步配置：Vite 在构建时把 VITE_* 内联进产物。这两个值是「可公开」的前端配置
        # （数据隔离由数据库 RLS 保证），在仓库 Settings → Secrets and variables → Actions
        # 里配置为 Secrets（或 Variables）后注入。未配置则线上站点退回纯本地模式。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 若仓库尚未开启 Pages，这一步会自动开启（构建源 = GitHub Actions）
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
