name: Deploy to GitHub Pages

on:
  # 推送到 main 自动部署
  push:
    branches: [main]
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# 部署到 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 pnpm 安装：规避 GitHub 托管 runner 上 npm "Exit handler never called!"
      # 的安装挂起崩溃。pnpm 版本取自 package.json 的 packageManager 字段。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 若仓库尚未开启 Pages，这一步会自动开启（构建源 = GitHub Actions）
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
