name: Build Tauri App (Windows)

# 只在 CI 上打 Windows 安装包；macOS 在本地用 `pnpm tauri build` 打。
# 触发方式：
#   - Actions 页面手动触发（workflow_dispatch）
#   - 推送 v* 标签（如 v0.1.0）时自动构建，并把安装包发布到 GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # 发布 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo registry 与 target，二次构建从 ~8 分钟降到 ~2 分钟
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand 会先跑 pnpm build（tsc + vite + version.json 清单）
      # 只出 NSIS 安装包（.exe），比 "all"（NSIS+MSI）快且够用
      - name: Build Tauri app (NSIS installer)
        run: pnpm tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHXY-Calendar-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 打 v* 标签时，把安装包挂到对应的 GitHub Release 上
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
